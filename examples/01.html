<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9주차 예제 1 · 켜는 곳은 자식이 아니라 부모입니다</title>
  <style>
    /*
    9주차 예제 1 — 켜는 곳은 자식이 아니라 부모입니다
    */
    body {
      background-color: #99DFE6;  /* 민트와 밝은 하늘색의 중간색 */
    }

    .container {        /* ← 부모(flex container)에 선언 */
      display: flex;
    }
    /* .container의 자식들(flex item)이 자동으로 가로로 늘어섭니다. */

    .mascot {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);  /* 이미지 자기 크기의 절반만큼 되돌려 정확히 중앙에 맞춤 */
    width: 450px;
    mix-blend-mode: multiply;

    }
  </style>
</head>
<body>
  <h1>제목</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>소프트웨어학과</li>
    <li>202378008</li>
    <li>채수혁</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>

  <img class="mascot" src="ab.png" alt="캐릭터">
</body>
</html>
