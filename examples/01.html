<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9주차 예제 1 · 켜는 곳은 자식이 아니라 부모입니다</title>
  <style>
    /*
    9주차 예제 1 — 켜는 곳은 자식이 아니라 부모입니다
    */
    body {
      background-color: #99DFE6;  /* 민트와 밝은 하늘색의 중간색 */
    }

    .container {        /* ← 부모(flex container)에 선언 */
      display: flex;
    }
    /* .container의 자식들(flex item)이 자동으로 가로로 늘어섭니다. */

    /* 가운데 사진 */
    .mascot {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 450px;
      mix-blend-mode: multiply;
    }

    /* 왼쪽 사진 */
    .left-photo {
      position: fixed;
      left: 20px;                    /* 화면 왼쪽에서 띄울 거리 */
      top: 50%;
      transform: translateY(-50%);   /* 세로 가운데 맞춤 */
      width: 300px;                  /* ★ 크기는 원하는 대로 조절 */
      mix-blend-mode: multiply;      /* 흰 배경 사진이면 유지, 아니면 이 줄 삭제 */
    }
  </style>
</head>
<body>
  <h1>제목</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>소프트웨어학과</li>
    <li>202378008</li>
    <li>채수혁</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>

  <!-- 가운데 사진 -->
  <img class="mascot" src="ab.png" alt="캐릭터">

  <!-- ★ 왼쪽 사진: src에 넣을 사진 파일 이름을 적으세요 -->
  <img class="left-photo" src="abc.png" alt="왼쪽 사진">
</body>
</html>
